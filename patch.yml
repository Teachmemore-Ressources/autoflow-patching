---
- name: Patch Linux lab-agent in batches of 10
  hosts: linux_lab
  gather_facts: false
  serial: 10
  max_fail_percentage: 0
  any_errors_fatal: true

  vars:
    lab_package: lab-agent

  tasks:
    - name: Check application health before patch
      ansible.builtin.command:
        argv:
          - /usr/local/bin/lab-health
      register: pre_health
      changed_when: false

    - name: Capture package version before patch
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Version}"
          - "{{ lab_package }}"
      register: version_before
      changed_when: false

    - name: Refresh isolated laboratory APT repository
      ansible.builtin.command:
        argv:
          - apt-get
          - update
          - "-o"
          - "Dir::Etc::sourcelist=sources.list.d/lab-agent.list"
          - "-o"
          - "Dir::Etc::sourceparts=-"
          - "-o"
          - "APT::Get::List-Cleanup=0"
      changed_when: false

    - name: Upgrade only lab-agent
      ansible.builtin.command:
        argv:
          - apt-get
          - install
          - "-y"
          - "--only-upgrade"
          - "{{ lab_package }}"
      register: patch_result
      changed_when: "'Setting up lab-agent' in patch_result.stdout"

    - name: Capture package version after patch
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - "-f=${Version}"
          - "{{ lab_package }}"
      register: version_after
      changed_when: false

    - name: Check application health after patch
      ansible.builtin.command:
        argv:
          - /usr/local/bin/lab-health
      register: post_health
      changed_when: false
      failed_when: false

    - name: Publish patch evidence in AutoFlow job output
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          package: "{{ lab_package }}"
          version_before: "{{ version_before.stdout }}"
          version_after: "{{ version_after.stdout }}"
          version_changed: "{{ version_before.stdout != version_after.stdout }}"
          pre_health_rc: "{{ pre_health.rc }}"
          post_health_rc: "{{ post_health.rc }}"
          status: "{{ 'ok' if post_health.rc == 0 else 'failed' }}"
          simulation: true

    - name: Stop campaign if application health fails
      ansible.builtin.fail:
        msg: >-
          Post-patch application health failed for
          {{ inventory_hostname }}
          (rc={{ post_health.rc }}).
          Campaign halted.
      when: post_health.rc != 0
